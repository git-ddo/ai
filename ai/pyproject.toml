[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ddo-ai"
version = "0.1.0"
description = "AI server for GitDdo portfolio coaching"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "google-genai>=2.18,<3",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "PyYAML>=6.0",
    "tenacity>=9.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
